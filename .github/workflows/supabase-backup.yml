name: Daily Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install PostgreSQL Client Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Run Database Dump (pg_dump)
      env:
        PGHOST: aws-0-ap-northeast-2.pooler.supabase.com
        PGPORT: 6543
        PGUSER: postgres.jrhiuiqvxufhrklavhyt
        PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        PGDATABASE: postgres
      run: |
        echo "Starting PocketMunim database backup..."
        DATE=$(date +'%Y-%m-%d')
        
        # Explicitly using environment variables to bypass shell parsing bugs
        pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -F c -f "pocketmunim_backup_$DATE.dump"
        
        echo "Backup completed successfully."

    - name: Upload Backup as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: database-backup-${{ github.run_id }}
        path: pocketmunim_backup_*.dump
        retention-days: 30