name: Daily Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install PostgreSQL 17 Client Tools
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
        sudo sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        sudo apt-get update
        sudo apt-get install -y postgresql-client-17

    - name: Run Database Dump (pg_dump v17)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        echo "Starting PocketMunim database backup..."
        DATE=$(date +'%Y-%m-%d')
        
        # Explicitly call the v17 binary to bypass Ubuntu's default pg_wrapper
        /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -F c -f "pocketmunim_backup_$DATE.dump"
        
        echo "Backup completed successfully."

    - name: Upload Backup as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: database-backup-${{ github.run_id }}
        path: pocketmunim_backup_*.dump
        retention-days: 30