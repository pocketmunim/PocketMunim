name: Daily Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run Database Dump with PostgreSQL 17 Docker
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        echo "Starting PocketMunim database backup via Postgres 17 container..."
        
        # Executes pg_dump directly inside official PostgreSQL 17 container
        docker run --rm \
          -e SUPABASE_DB_URL="$SUPABASE_DB_URL" \
          -v "${{ github.workspace }}:/backup" \
          postgres:17 \
          sh -c 'pg_dump "$SUPABASE_DB_URL" -F c -f "/backup/pocketmunim_backup_$(date +%Y-%m-%d).dump"'
        
        echo "Backup completed successfully."

    - name: Upload Backup as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: database-backup-${{ github.run_id }}
        path: pocketmunim_backup_*.dump
        retention-days: 30