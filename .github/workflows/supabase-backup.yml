name: Daily Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install PostgreSQL Client Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Run Database Dump (pg_dump)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        echo "Starting PocketMunim database backup..."
        DATE=$(date +'%Y-%m-%d')
        
        # Explicitly using the URI string with network routing to prevent local socket fallback
        pg-dump --version
        pg_dump "$SUPABASE_DB_URL" -F c -f "pocketmunim_backup_$DATE.dump"
        
        echo "Backup completed successfully."

    - name: Upload Backup as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: database-backup-${{ github.run_id }}
        path: pocketmunim_backup_*.dump
        retention-days: 30